<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Todo</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"> Todo App </a>
        <div>
          <a href="index.html" class="btn btn-light btn-sm me-2"> Login </a>
          <a href="todo.html" class="btn btn-warning btn-sm"> Add Todo </a>
        </div>
      </div>
    </nav>
    <!-- Edit Todo -->
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
              <h4 class="mb-0">Edit Todo</h4>
            </div>
            <div class="card-body p-4">
              <form>
                <!-- Title -->
                <div class="mb-3">
                  <label for="titles" class="form-label"> Todo Title </label>
                  <input
                    type="text"
                    id="titles"
                    class="form-control"
                    placeholder="Enter todo title"
                  />
                </div>
                <!-- Description -->
                <div class="mb-3">
                  <label for="dess" class="form-label"> Description </label>
                  <textarea
                    id="dess"
                    class="form-control"
                    rows="4"
                    placeholder="Enter description"
                  ></textarea>
                </div>
                <!-- Save -->
                <button
                  type="button"
                  onclick="save()"
                  class="btn btn-success w-100"
                >
                  Save Todo
                </button>
              </form>
            </div>
          </div>
          <!-- Navigation buttons -->
          <div class="text-center mt-3">
            <a href="todo.html" class="btn btn-outline-primary me-2">
              Add Todo
            </a>
            <a href="index.html" class="btn btn-outline-secondary"> Login </a>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Your JS -->
    <script src="todo.js"></script>
  </body>
</html>
